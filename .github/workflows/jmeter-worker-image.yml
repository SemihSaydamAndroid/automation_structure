name: jmeter-worker-image

on:
  push:
    branches: [main]
    paths: ["docker/jmeter-worker/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/jmeter-worker
          push: true
          # Registry names must be lowercase (matches k8s.perf.image default)
          tags: ghcr.io/semihsaydamandroid/jmeter-worker:5.6.3
