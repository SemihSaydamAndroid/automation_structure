# automation-ai defaults. AI is opt-in: nothing is sent anywhere until ai.provider is set.

# none | ollama | openai-compatible | anthropic
ai.provider=none
# Defaults: ollama -> llama3.1:8b, anthropic -> claude-sonnet-5; required for openai-compatible
ai.model=
# Multimodal model for screenshots (e.g. llama3.2-vision:11b, qwen2.5vl:7b); defaults to ai.model
ai.vision-model=
# ollama -> http://localhost:11434, vLLM -> http://vllm.ai.svc:8000/v1
ai.base-url=
# Use a secret reference, e.g. ${secret:anthropic-api-key}
ai.api-key=
ai.temperature=0.0
ai.max-tokens=1024
ai.timeout=60s
# Mask credentials and personal data (e-mail, TCKN, IBAN, card, phone) before sending
ai.redact=true
ai.max-context-chars=60000

ai.failure-analysis.enabled=true
# Send the screenshot too (needs a vision model)
ai.failure-analysis.screenshot=false
ai.healing.enabled=true
