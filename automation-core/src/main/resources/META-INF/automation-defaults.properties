# automation-core defaults. Every framework jar ships a file with this exact name;
# AutomationConfig merges all of them before the client's automation.properties.

# Identity of the run (overridable: -Dautomation.env=preprod, AUTOMATION_PROFILE=ci ...)
automation.env=default

# Locale for Datafaker based test data
data.locale=tr

# Attach a failure triage (rule based, or AI when automation-ai is configured)
report.failure-analysis.enabled=true
