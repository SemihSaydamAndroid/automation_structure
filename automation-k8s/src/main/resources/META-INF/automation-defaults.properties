# automation-k8s defaults

# kubeconfig context to use (empty = current context, or in-cluster service account)
k8s.context=
# Explicit namespace; when empty the profile decides (local / ci)
k8s.namespace=
k8s.namespace.local=qa-local
k8s.namespace.ci=qa-ci
# auto | port-forward | pod-ip
k8s.connection=auto
k8s.image-pull-secret=
# k8s.node-selector.<label>=<value>

# ---------------------------------------------------------------- browser pods
# Pin exact tags in your automation.properties for reproducible runs.
k8s.browser.image.chrome=selenium/standalone-chrome:latest
k8s.browser.image.firefox=selenium/standalone-firefox:latest
k8s.browser.image.edge=selenium/standalone-edge:latest
k8s.browser.cpu=500m
k8s.browser.cpu-limit=2
k8s.browser.memory=1Gi
k8s.browser.memory-limit=2Gi
k8s.browser.shm-size=2Gi
k8s.browser.startup-timeout=3m
# activeDeadlineSeconds: orphaned browser pods are killed after this
k8s.browser.max-lifetime=1h
# noVNC on port 7900, forwarded and logged so you can watch a remote browser
k8s.browser.live-view=false

# ---------------------------------------------------------------- remote runner
k8s.runner.image=maven:3.9.11-eclipse-temurin-21
k8s.runner.cpu=1
k8s.runner.cpu-limit=4
k8s.runner.memory=2Gi
k8s.runner.memory-limit=4Gi
k8s.runner.service-account=qa-runner
# PersistentVolumeClaim caching ~/.m2/repository between runs (strongly recommended)
k8s.runner.m2-pvc=
# Kubernetes Secret mounted at /etc/automation/secrets (read by ${secret:name})
k8s.runner.secret-name=
k8s.runner.command=mvn -B test
k8s.runner.results=target/allure-results,target/surefire-reports,target/karate-reports,target/jmeter,target/healing-report.json
k8s.runner.excludes=target,.git,.idea,.vscode,node_modules,.DS_Store
k8s.runner.startup-timeout=5m
k8s.runner.max-lifetime=2h
k8s.runner.keep-pod=false
