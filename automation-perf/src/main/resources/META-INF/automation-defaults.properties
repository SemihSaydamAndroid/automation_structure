# automation-perf defaults

# Falls back to api.base-url when empty
perf.base-url=
# Active load profile: smoke | load | stress | spike | soak (or your own perf.profile.<name>.*)
perf.profile=smoke
perf.profile.smoke.threads=1
perf.profile.smoke.iterations=1
perf.profile.load.threads=50
perf.profile.load.ramp-up=1m
perf.profile.load.hold=10m
perf.profile.stress.threads=200
perf.profile.stress.ramp-up=5m
perf.profile.stress.hold=15m
perf.profile.spike.threads=300
perf.profile.spike.ramp-up=10s
perf.profile.spike.hold=2m
perf.profile.soak.threads=30
perf.profile.soak.ramp-up=2m
perf.profile.soak.hold=2h

# SLA checked by PerfResult.assertSla() (empty = not checked)
perf.sla.p95=
perf.sla.p99=
perf.sla.error-rate=1
perf.sla.throughput=

# embedded | distributed (perf.distributed.hosts=host1:1099,host2:1099)
perf.engine=embedded
perf.distributed.hosts=
perf.report-dir=target/jmeter
perf.report.html=true
# Extra JMeter properties: perf.jmeter-props.<name>=<value>

# Guard: a laptop (profile=local, outside Kubernetes) may not start more threads than this.
# Real load runs from the pipeline or from the cluster via the remote runner.
perf.guard.local-max-threads=5
perf.guard.allow-local-load=false
