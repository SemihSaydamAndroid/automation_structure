# automation-ui defaults

# chrome | firefox | edge | safari
ui.browser=chrome
# local | remote | kubernetes
ui.execution=local
ui.headless=false
# Used when ui.execution=remote
ui.grid-url=http://localhost:4444
# Base for BasePage.open("/relative/path")
ui.base-url=
ui.window-size=1920x1080

ui.timeout.explicit=10s
ui.timeout.page-load=60s
ui.timeout.script=30s
ui.timeout.remote-read=3m
ui.poll-interval=200ms

ui.accept-insecure-certs=true
# WebDriver BiDi (browser console capture). Needs a BiDi capable browser/grid.
ui.bidi=false
ui.log-actions=true
# Extra browser arguments, comma separated
ui.arguments=

# Self-healing: heuristic healer always, AI healer when automation-ai is configured
ui.healing.enabled=true
ui.healing.report=target/healing-report.json

# Extra capabilities: ui.capabilities.<name>=<value>
