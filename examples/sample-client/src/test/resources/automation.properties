# Shared by UI, API, performance, Kubernetes and AI modules. Override per environment in
# automation-<env>.properties (-Denv=staging), per profile in automation-<local|ci>.properties,
# or ad hoc with AUTOMATION_* env vars / -D system properties.

# Demo targets; point these at your own system.
ui.base-url=https://the-internet.herokuapp.com
api.base-url=https://jsonplaceholder.typicode.com

ui.browser=chrome

# Performance: never generate real load against systems you do not own.
perf.sla.p95=1500ms
perf.sla.error-rate=1

# Kubernetes (used when ui.execution=kubernetes, by the remote runner and distributed load)
k8s.browser.image.chrome=selenium/standalone-chrome:latest
k8s.runner.m2-pvc=qa-m2-cache
k8s.runner.secret-name=qa-secrets
k8s.perf.allowed-hosts=*.staging.example.com

# AI: off by default. Local open model:  ai.provider=ollama  ai.model=llama3.1:8b
#     In-cluster vLLM:                  ai.provider=openai-compatible  ai.base-url=http://vllm.ai.svc:8000/v1  ai.model=Qwen/Qwen2.5-7B-Instruct
#     Claude:                           ai.provider=anthropic  ai.api-key=${secret:anthropic-api-key}
ai.provider=none

# Test users for domain sentences; real projects use ${secret:...}
users.tomsmith.password=SuperSecretPassword!
