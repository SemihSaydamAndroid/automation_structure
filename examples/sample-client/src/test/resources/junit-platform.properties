# Cucumber: framework sentences + this project's domain sentences
cucumber.glue=io.github.semihsaydamandroid.automation.bdd.steps,com.example.qa.bdd.steps
cucumber.plugin=pretty, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm, io.github.semihsaydamandroid.automation.bdd.support.FailureCapture
cucumber.publish.quiet=true
# Parallel scenarios; every thread gets its own browser
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
