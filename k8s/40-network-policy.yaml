# Browser pods accept WebDriver traffic only from pods of the same namespace (runner pods,
# in-cluster CI agents). Laptops reach them through `kubectl port-forward`, which is authorized
# by RBAC (pods/portforward) and not affected by NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: browser-ingress
  namespace: qa-local
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: browser
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: browser-ingress
  namespace: qa-ci
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: browser
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
