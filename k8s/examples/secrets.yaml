# Mounted into runner pods at /etc/automation/secrets (k8s.runner.secret-name=qa-secrets) and read
# by ${secret:name} in automation.properties. Prefer External Secrets / Vault over plain manifests.
apiVersion: v1
kind: Secret
metadata:
  name: qa-secrets
  namespace: qa-ci
type: Opaque
stringData:
  admin-password: change-me
  anthropic-api-key: ""
  # Maven settings with repository credentials: mvn -s /etc/automation/secrets/settings.xml ...
  settings.xml: |
    <settings>
      <servers>
        <server><id>github</id><username>ci-bot</username><password>token</password></server>
      </servers>
    </settings>
